# Optional override: send the container's DNS lookups to your LAN's resolver, so names that
# exist only there (a KyRecovery behind your own proxy) resolve inside the container. It
# replaces the host's resolvers for every lookup this container makes, which is why it is
# not in the base file. A value in .env alone does nothing; pass it on the command line and
# recreate the container:
#
#   KYBOOKMARKS_DNS=192.168.1.1 docker compose -f docker-compose.yml -f docker-compose.lan-dns.yml up -d --force-recreate
services:
  kybookmarks-server:
    dns:
      - ${KYBOOKMARKS_DNS:?set KYBOOKMARKS_DNS to your LAN DNS server}
