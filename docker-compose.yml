name: kymark-server

services:
  kymark-server:
    # The published, attested image. `pull` moves to the newest one; `up` uses what is
    # present, otherwise pulls. This file never builds: a source build would occupy this
    # name with unattested bytes, so it lives in docker-compose.build.yml under a local tag.
    # Source installs add docker-compose.build.yml to the COMPOSE_FILE chain in .env (other overlays
    # may sit beside it); Compose reads it before every command. An explicit -f list replaces it
    # outright, so never mix the two.
    # To run only what CI attested, pin the commit you chose by digest and verify it first (gh
    # logged in). Tags are movable, :<commit sha> included, so the digest comes from the tag but
    # the guarantee comes from the attestation: it must verify against this workflow on master
    # AND record your commit as its source, or the chain stops. The new .env is staged in this
    # directory and renamed atomically over the old one only if the filtered copy was written
    # in full, so a failed check, an unreadable .env or a short write never replaces your
    # secrets. Re-run with a newer sha to move; delete the KYMARK_IMAGE line to follow :latest
    # again. A source install is unaffected: the build overlay's image wins over this pin.
    #   sha=<full commit sha you intend to run, e.g. $(git rev-parse origin/master)>
    #   d=$(docker buildx imagetools inspect ghcr.io/busness-app/kymark-server:$sha --format '{{.Manifest.Digest}}') \
    #     && gh attestation verify "oci://ghcr.io/busness-app/kymark-server@$d" --repo Busness-app/kymark-server \
    #          --cert-identity https://github.com/Busness-app/kymark-server/.github/workflows/ci.yml@refs/heads/master \
    #     && [ "$(gh attestation verify "oci://ghcr.io/busness-app/kymark-server@$d" --repo Busness-app/kymark-server \
    #          --cert-identity https://github.com/Busness-app/kymark-server/.github/workflows/ci.yml@refs/heads/master \
    #          --format json --jq '.[0].verificationResult.statement.predicate.buildDefinition.resolvedDependencies[0].digest.gitCommit')" = "$sha" ] \
    #     && (umask 077; t=$(mktemp ./.env.XXXXXX) && touch .env && { grep -v '^KYMARK_IMAGE=' .env || [ $? -eq 1 ]; } > "$t" \
    #         && echo "KYMARK_IMAGE=ghcr.io/busness-app/kymark-server@$d" >> "$t" && mv "$t" .env) \
    #     && grep -qxF "KYMARK_IMAGE=ghcr.io/busness-app/kymark-server@$d" .env
    image: ${KYMARK_IMAGE:-ghcr.io/busness-app/kymark-server:latest}
    pull_policy: missing
    container_name: KyMark-Server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    networks:
      kypost-net:
        ipv4_address: ${KYMARK_IP:-10.89.0.6}

    ports:
      - "${KYMARK_BIND:-127.0.0.1}:5869:5869"

    environment:
      PORT: 5869
      DATA_DIR: /app/data
      # The audit key lives here, on a separate volume from the log it protects.
      CONFIG_DIR: /app/config
      WEB_DIR: /app/frontend/dist
      # Optional. Unset means the server generates a key into CONFIG_DIR on first run.
      AUDIT_KEY: ${AUDIT_KEY:-}
      # Only verifies audit entries written before the chain was keyed. Not a live secret.
      HMAC_SECRET: ${HMAC_SECRET:-}
      # No default: unset disables the /api/sync/events webhook rather than
      # authenticating it with a value published in this repository. At least 16
      # bytes; KySignOn mints 32. It is the HMAC key and never travels in a header.
      SYNC_SECRET: ${SYNC_SECRET:-}
      # Sealed backups. Empty = no local copies; pair with KyRecovery or set this to
      # /app/backups (the volume below) so an instance with no KyRecovery still has backups.
      KYMARK_BACKUP_DIR: ${KYMARK_BACKUP_DIR:-}
      KYMARK_BACKUP_KEEP: ${KYMARK_BACKUP_KEEP:-7}
      # Default schedule only; the admin sets the live one in the Backup tab.
      KYMARK_BACKUP_DEPOSIT_INTERVAL: ${KYMARK_BACKUP_DEPOSIT_INTERVAL:-24h}
      # Off: a KyRecovery on a private or CGNAT address is refused. HTTPS is always required.
      KYMARK_BACKUP_ALLOW_PRIVATE_RECOVERY: ${KYMARK_BACKUP_ALLOW_PRIVATE_RECOVERY:-false}
      # KYMARK_DNS lives only in docker-compose.lan-dns.yml.

    volumes:
      - kybookmarks_data:/app/data
      - kybookmarks_config:/app/config
      # Used only when KYMARK_BACKUP_DIR=/app/backups.
      - kybookmarks_backups:/app/backups

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5869/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  # Keep the established volume names so renaming the service never creates
  # empty volumes and hides an existing installation's data.
  kybookmarks_data:
  kybookmarks_config:
  kybookmarks_backups:

networks:
  kypost-net:
    external: true
