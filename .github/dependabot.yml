version: 2

# ky-primitives is the suite's shared crypto library, and a bump to it arrives in its
# own PR: it is reviewed against the capsule and recovery-key contract, not waved
# through in a batch with x/crypto and action pins. The compat workflow proves the
# library's default branch still builds this product; Dependabot is what moves the
# pin to a tagged release once it does.
#
# Three days of cooldown on every ecosystem: a tag that has been out for three days
# has had three days for someone to find it was yanked. Cooldown applies to version
# updates only; a security update still arrives the day it is published.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      ky-primitives:
        patterns: ["github.com/Busness-app/ky-primitives"]
      go:
        patterns: ["*"]
        exclude-patterns: ["github.com/Busness-app/ky-primitives"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      # A runtime bump can ship a vulnerability to a browser; a tooling bump can
      # only break the build, which CI catches. They must not block each other.
      frontend-runtime:
        dependency-type: production
        patterns: ["*"]
      frontend-tooling:
        dependency-type: development
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
